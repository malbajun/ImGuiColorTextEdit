name: ALT gear-hsh

on:
  push:
    branches: [ci/alt-hasher]
    paths:
      - .github/workflows/alt-hasher.yml
      - ci/alt-hasher/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alt-hasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and verify ALT packages through gear-hsh
        env:
          ALT_HASHER_BUILD_PACKAGES: '1'
        run: |
          mkdir -p artifacts/alt-hasher
          bash ci/alt-hasher/run.sh 2>&1 | tee artifacts/alt-hasher/runner.log
      - name: Report failure diagnostics
        if: failure()
        run: python3 ci/alt-hasher/report.py
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alt-hasher-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/alt-hasher/
          if-no-files-found: error
          retention-days: 14
